<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Syntari revenue analytics card.">
  <title>Revenue card — Syntari UI</title>
  <link rel="icon" href="../../favicon.svg">
  <link rel="stylesheet" href="../../tokens.css">
  <link rel="stylesheet" href="../../styles.css">
  <link rel="stylesheet" href="../../controls.css">
  <link rel="stylesheet" href="../new.css">
  <script src="../../motion.js"></script>
  <script src="../../controls.js"></script>
  <script type="module" src="../new.js"></script>
  <script
    src="https://app.kobbe.io/tracker.js"
    data-token="01b288b6.Nx0YyvTQEED6n-xflmasSvpRFosUDlsw"
    defer
  ></script>
</head>
<body class="syntari-shot">
  <a class="shot-back" href="../">Syntari / new</a>
  <main class="shot-stage">
    <article class="analytics-card shot-component" data-revenue-card data-loading="true" aria-busy="true" aria-labelledby="revenue-title">
      <header class="analytics-card-head">
        <div>
          <h2 id="revenue-title">Revenue</h2>
          <p>Total revenue across all products</p>
        </div>
        <div class="dropdown ds-select period-select" data-revenue-period data-value="30d">
    <button class="control-trigger" type="button" data-select-toggle aria-label="Revenue period" aria-haspopup="listbox" aria-expanded="false">
      <span data-select-label>Last 30 days</span><svg class="icon lucide icon-down" aria-hidden="true" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"></path></svg>
    </button>
    <div class="dropdown-panel control-panel" role="listbox" aria-label="Revenue period options" hidden>
      <button type="button" role="option" aria-selected="false" data-option="Last 7 days" data-value="7d"><svg class="icon lucide icon-calendar" aria-hidden="true" viewBox="0 0 24 24"><path d="M8 2v4"></path><path d="M16 2v4"></path><rect width="18" height="18" x="3" y="4" rx="2"></rect><path d="M3 10h18"></path></svg><span>Last 7 days</span><span class="option-check"><svg class="icon lucide icon-check" aria-hidden="true" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"></path></svg></span></button><button type="button" role="option" aria-selected="true" data-option="Last 30 days" data-value="30d"><svg class="icon lucide icon-calendar" aria-hidden="true" viewBox="0 0 24 24"><path d="M8 2v4"></path><path d="M16 2v4"></path><rect width="18" height="18" x="3" y="4" rx="2"></rect><path d="M3 10h18"></path></svg><span>Last 30 days</span><span class="option-check"><svg class="icon lucide icon-check" aria-hidden="true" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"></path></svg></span></button><button type="button" role="option" aria-selected="false" data-option="Last 90 days" data-value="90d"><svg class="icon lucide icon-calendar" aria-hidden="true" viewBox="0 0 24 24"><path d="M8 2v4"></path><path d="M16 2v4"></path><rect width="18" height="18" x="3" y="4" rx="2"></rect><path d="M3 10h18"></path></svg><span>Last 90 days</span><span class="option-check"><svg class="icon lucide icon-check" aria-hidden="true" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"></path></svg></span></button>
    </div>
  </div>
      </header>

      <div class="revenue-summary">
        <strong class="revenue-value" data-revenue-value>€24,532</strong>
        <div class="revenue-change"><span aria-hidden="true">↑</span><strong data-revenue-delta>+12.4%</strong><span>vs. previous period</span></div>
      </div>

      <figure class="revenue-chart" aria-labelledby="revenue-chart-caption">
        <figcaption id="revenue-chart-caption" class="sr-only">Revenue trend for the selected period, with several rises and falls.</figcaption>
        <svg class="revenue-svg" viewBox="0 0 640 220" role="img" aria-label="Revenue trend">
          <defs>
            <linearGradient id="revenue-fill" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="var(--green-4)" stop-opacity=".26"></stop>
              <stop offset="100%" stop-color="var(--green-4)" stop-opacity=".02"></stop>
            </linearGradient>
          </defs>
          <g class="chart-grid" aria-hidden="true">
            <line x1="8" y1="48" x2="632" y2="48"></line>
            <line x1="8" y1="98" x2="632" y2="98"></line>
            <line x1="8" y1="148" x2="632" y2="148"></line>
            <line x1="8" y1="198" x2="632" y2="198"></line>
          </g>
          <path class="revenue-area" data-revenue-area d=""></path>
          <path class="revenue-line" data-revenue-line d=""></path>
          <circle class="revenue-point" data-revenue-point cx="0" cy="0" r="5"></circle>
        </svg>
        <div class="revenue-tooltip" data-revenue-tooltip>€2,840</div>
        <div class="chart-axis" data-revenue-axis>
          <span>Aug 20</span><span>Aug 27</span><span>Sep 3</span><span>Sep 10</span><span>Sep 17</span>
        </div>
      </figure>

      <footer class="analytics-card-foot">
        <a href="../team-projects-report/">View detailed analytics</a>
        <a class="square-action" href="../team-projects-report/" aria-label="View detailed analytics"><svg class="icon lucide " aria-hidden="true" viewBox="0 0 24 24"><path d="M7 17 17 7"></path><path d="M7 7h10v10"></path></svg></a>
      </footer>
      <div class="shot-loading-overlay revenue-loading" data-loading-overlay aria-hidden="true">
  <div class="skeleton-row"><span class="skeleton-block w-32"></span><span class="skeleton-block w-22"></span></div>
  <span class="skeleton-block skeleton-value w-42"></span>
  <span class="skeleton-block w-36"></span>
  <span class="skeleton-block skeleton-chart"></span>
  <div class="skeleton-row skeleton-axis"><span></span><span></span><span></span><span></span><span></span></div>
  <div class="skeleton-divider"></div>
  <div class="skeleton-row"><span class="skeleton-block w-30"></span><span class="skeleton-block skeleton-square"></span></div>
</div>
    </article>
  </main>
</body>
</html>
