<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Syntari command palette composition.">
  <title>Command palette — Syntari UI</title>
  <link rel="icon" href="../../favicon.svg">
  <link rel="stylesheet" href="../../tokens.css">
  <link rel="stylesheet" href="../../styles.css">
  <link rel="stylesheet" href="../new.css">
  <script type="module" src="../new.js"></script>
</head>
<body class="syntari-shot">
  <a class="shot-back" href="../">Syntari / new</a>
  <main class="shot-stage">
    <section class="command-palette shot-component" data-command-palette aria-label="Command palette">
      <label class="command-palette-search">
        <svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
        <input type="search" data-command-input placeholder="Search for anything..." aria-label="Search commands" autocomplete="off">
        <kbd>⌘ K</kbd>
      </label>

      <div class="command-group" data-command-group>
        <div class="command-group-label">Quick actions</div>
        <div role="listbox" aria-label="Quick actions">
          <button class="command-item is-active" type="button" role="option" aria-selected="true" data-command-value="New project">
            <span class="command-icon success" aria-hidden="true">＋</span><span>New project</span><kbd>⌘ N</kbd>
          </button>
          <button class="command-item" type="button" role="option" aria-selected="false" data-command-value="Invite team member">
            <span class="command-icon" aria-hidden="true">◎</span><span>Invite team member</span><kbd>⌘ I</kbd>
          </button>
          <button class="command-item" type="button" role="option" aria-selected="false" data-command-value="Create document">
            <span class="command-icon" aria-hidden="true">□</span><span>Create document</span><kbd>⌘ D</kbd>
          </button>
          <button class="command-item" type="button" role="option" aria-selected="false" data-command-value="Open template">
            <span class="command-icon" aria-hidden="true">▦</span><span>Open template</span><kbd>⌘ T</kbd>
          </button>
        </div>
      </div>

      <div class="command-divider"></div>

      <div class="command-group" data-command-group>
        <div class="command-group-label">Navigate</div>
        <div role="listbox" aria-label="Navigation">
          <button class="command-item" type="button" role="option" aria-selected="false" data-command-value="Go to dashboard">
            <span class="command-icon" aria-hidden="true">⌂</span><span>Go to dashboard</span><kbd>⌘ 1</kbd>
          </button>
          <button class="command-item" type="button" role="option" aria-selected="false" data-command-value="View analytics">
            <span class="command-icon" aria-hidden="true">▥</span><span>View analytics</span><kbd>⌘ 2</kbd>
          </button>
          <button class="command-item" type="button" role="option" aria-selected="false" data-command-value="Open settings">
            <span class="command-icon" aria-hidden="true">⚙</span><span>Open settings</span><kbd>⌘ ,</kbd>
          </button>
        </div>
      </div>

      <div class="command-divider"></div>

      <div class="command-group command-recent" data-command-group>
        <div class="command-group-label">Recent</div>
        <div role="listbox" aria-label="Recent">
          <button class="command-item" type="button" role="option" aria-selected="false" data-command-value="Product roadmap">
            <span class="command-icon" aria-hidden="true">□</span><span>Product roadmap</span><small>2h ago</small>
          </button>
          <button class="command-item" type="button" role="option" aria-selected="false" data-command-value="Design system">
            <span class="command-icon" aria-hidden="true">◎</span><span>Design system</span><small>5h ago</small>
          </button>
          <button class="command-item" type="button" role="option" aria-selected="false" data-command-value="Q3 planning">
            <span class="command-icon" aria-hidden="true">□</span><span>Q3 planning</span><small>1d ago</small>
          </button>
        </div>
      </div>
      <p class="sr-only" data-command-status role="status"></p>
    </section>
  </main>
</body>
</html>
