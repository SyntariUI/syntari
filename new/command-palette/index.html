<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Syntari command palette composition.">
  <title>Command palette — Syntari UI</title>
  <link rel="icon" href="../../favicon.svg">
  <link rel="stylesheet" href="../../tokens.css">
  <link rel="stylesheet" href="../../styles.css">
  <link rel="stylesheet" href="../new.css">
  <script type="module" src="../new.js"></script>
</head>
<body class="syntari-shot">
  <a class="shot-back" href="../">Syntari / new</a>
  <main class="shot-stage">
    <section class="command-palette shot-component" data-command-palette aria-label="Command palette">
      <label class="command-palette-search">
        <svg class="icon lucide " aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
        <input type="search" data-command-input placeholder="Search for anything..." aria-label="Search commands" autocomplete="off">
        <kbd>⌘ K</kbd>
      </label>

      <div class="command-group" data-command-group>
        <div class="command-group-label">Quick actions</div>
        <div role="listbox" aria-label="Quick actions">
          <button class="command-item is-active" type="button" role="option" aria-selected="true" data-command-value="New project">
            <span class="command-icon success"><svg class="icon lucide " aria-hidden="true" viewBox="0 0 24 24"><path d="M12 10v6"></path><path d="M9 13h6"></path><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.9 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"></path></svg></span><span>New project</span><kbd>⌘ N</kbd>
          </button>
          <button class="command-item" type="button" role="option" aria-selected="false" data-command-value="Invite team member">
            <span class="command-icon"><svg class="icon lucide " aria-hidden="true" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><line x1="19" x2="19" y1="8" y2="14"></line><line x1="22" x2="16" y1="11" y2="11"></line></svg></span><span>Invite team member</span><kbd>⌘ I</kbd>
          </button>
          <button class="command-item" type="button" role="option" aria-selected="false" data-command-value="Create document">
            <span class="command-icon"><svg class="icon lucide " aria-hidden="true" viewBox="0 0 24 24"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" x2="8" y1="13" y2="13"></line><line x1="16" x2="8" y1="17" y2="17"></line><line x1="10" x2="8" y1="9" y2="9"></line></svg></span><span>Create document</span><kbd>⌘ D</kbd>
          </button>
          <button class="command-item" type="button" role="option" aria-selected="false" data-command-value="Open template">
            <span class="command-icon"><svg class="icon lucide " aria-hidden="true" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2"></rect><path d="M3 9h18"></path><path d="M9 21V9"></path></svg></span><span>Open template</span><kbd>⌘ T</kbd>
          </button>
        </div>
      </div>

      <div class="command-divider"></div>

      <div class="command-group" data-command-group>
        <div class="command-group-label">Navigate</div>
        <div role="listbox" aria-label="Navigation">
          <button class="command-item" type="button" role="option" aria-selected="false" data-command-value="Go to dashboard">
            <span class="command-icon"><svg class="icon lucide " aria-hidden="true" viewBox="0 0 24 24"><rect width="7" height="9" x="3" y="3" rx="1"></rect><rect width="7" height="5" x="14" y="3" rx="1"></rect><rect width="7" height="9" x="14" y="12" rx="1"></rect><rect width="7" height="5" x="3" y="16" rx="1"></rect></svg></span><span>Go to dashboard</span><kbd>⌘ 1</kbd>
          </button>
          <button class="command-item" type="button" role="option" aria-selected="false" data-command-value="View analytics">
            <span class="command-icon"><svg class="icon lucide " aria-hidden="true" viewBox="0 0 24 24"><path d="M3 3v18h18"></path><path d="M18 17V9"></path><path d="M13 17V5"></path><path d="M8 17v-3"></path></svg></span><span>View analytics</span><kbd>⌘ 2</kbd>
          </button>
          <button class="command-item" type="button" role="option" aria-selected="false" data-command-value="Open settings">
            <span class="command-icon"><svg class="icon lucide " aria-hidden="true" viewBox="0 0 24 24"><path d="M20 7h-9"></path><path d="M14 17H5"></path><circle cx="17" cy="17" r="3"></circle><circle cx="7" cy="7" r="3"></circle></svg></span><span>Open settings</span><kbd>⌘ ,</kbd>
          </button>
        </div>
      </div>

      <div class="command-divider"></div>

      <div class="command-group command-recent" data-command-group>
        <div class="command-group-label">Recent</div>
        <div role="listbox" aria-label="Recent">
          <button class="command-item" type="button" role="option" aria-selected="false" data-command-value="Product roadmap">
            <span class="command-icon"><svg class="icon lucide " aria-hidden="true" viewBox="0 0 24 24"><polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"></polygon><line x1="9" x2="9" y1="3" y2="18"></line><line x1="15" x2="15" y1="6" y2="21"></line></svg></span><span>Product roadmap</span><small>2h ago</small>
          </button>
          <button class="command-item" type="button" role="option" aria-selected="false" data-command-value="Design system">
            <span class="command-icon"><svg class="icon lucide " aria-hidden="true" viewBox="0 0 24 24"><path d="M5.5 8.5 9 12l-3.5 3.5L2 12z"></path><path d="m12 2 3.5 3.5L12 9 8.5 5.5z"></path><path d="m18.5 8.5 3.5 3.5-3.5 3.5L15 12z"></path><path d="m12 15 3.5 3.5L12 22l-3.5-3.5z"></path></svg></span><span>Design system</span><small>5h ago</small>
          </button>
          <button class="command-item" type="button" role="option" aria-selected="false" data-command-value="Q3 planning">
            <span class="command-icon"><svg class="icon lucide " aria-hidden="true" viewBox="0 0 24 24"><path d="M8 2v4"></path><path d="M16 2v4"></path><rect width="18" height="18" x="3" y="4" rx="2"></rect><path d="M3 10h18"></path><path d="M8 14h.01"></path><path d="M12 14h.01"></path><path d="M16 14h.01"></path><path d="M8 18h.01"></path><path d="M12 18h.01"></path></svg></span><span>Q3 planning</span><small>1d ago</small>
          </button>
        </div>
      </div>
      <p class="sr-only" data-command-status role="status"></p>
    </section>
  </main>
</body>
</html>
