name: Publish Syntari npm package
on:
  release:
    types: [published]
permissions:
  contents: write
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@^11.5.1
      - name: Match release tag to package version
        run: node -e "if (process.env.GITHUB_REF_NAME !== 'v' + require('./package.json').version) process.exit(1)"
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Attach install archive to GitHub release
        run: gh release upload "$GITHUB_REF_NAME" downloads/syntari-ui-*.tgz --clobber
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
