name: Test and publish Syntari
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: syntari-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

  verify-public-install:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify public Syntari install archive
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          archive="https://syntariui.github.io/syntari/downloads/syntari-ui-$version.tgz"

          for attempt in {1..18}; do
            if curl --fail --silent --show-error --location --head "$archive" >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 18 ]; then
              echo "Public Syntari archive is not reachable: $archive" >&2
              exit 1
            fi
            sleep 10
          done

          temp="$(mktemp -d)"
          cd "$temp"
          npm exec --yes --package="$archive" -- syntari add app-shell
          test -f components/syntari/app-shell.js
          test -f components/syntari/AGENTS.md
          test -f components/syntari/runtime/registry/index.json
